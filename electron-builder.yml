appId: com.khr.production
productName: KHR Production
copyright: Copyright © KHR Production
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**
  - electron/**
  - build-resources/icon.png
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.png
  artifactName: KHR-Production-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: KHR Production
